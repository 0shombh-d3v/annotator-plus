<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EPUB.js + Hypothesis Example</title>

  <script type="text/javascript">
    window.hypothesisConfig = function () {
      return {
        openSidebar: false,
        enableMultiFrameSupport: true,
        showHighlights: 'always',
        assetRoot: 'https://cdn.hypothes.is/hypothesis/',
        sidebarAppUrl: 'app://obsidian.md/annotator-plus/sidebar.html',
        notebookAppUrl: 'app://obsidian.md/annotator-plus/sidebar.html',
        profileAppUrl: 'app://obsidian.md/annotator-plus/sidebar.html',
        services: [{
          apiUrl: 'https://hypothes.is/api/',
          authority: 'partner.org',
          groups: ['__world__'],
          allowFlagging: false,
          allowLeavingGroups: false,
          enableShareLinks: false,
          enableShareImportExportPanel: false,
          enableAccountMenu: false,
          enableHelpPanel: false
        }],
        onLayoutChange: function(state) {
          var nav = document.getElementById("navigation");
          if (state.expanded === true) {
            nav.classList.remove("open");
          }
        }
      };
    };
  </script>
  <script class="js-hypothesis-config" type="application/json">
    {"assetRoot":"https://cdn.hypothes.is/hypothesis/","sidebarAppUrl":"app://obsidian.md/annotator-plus/sidebar.html","notebookAppUrl":"app://obsidian.md/annotator-plus/sidebar.html","profileAppUrl":"app://obsidian.md/annotator-plus/sidebar.html"}
  </script>
  <script src="https://cdn.hypothes.is/hypothesis/build/boot.js"></script>

  <link rel="stylesheet" type="text/css" href="css/reader.css">

</head>
<body>
  <div id="main">
    <button id="opener" class="reader-control" type="button" aria-label="Open table of contents">☰</button>
    <div id="viewer" class="spreads loading"></div>
    <span id="hiddenTitle"></span>
    <button id="prev" class="arrow reader-control" type="button" aria-label="Previous page">‹</button>
    <button id="next" class="arrow reader-control" type="button" aria-label="Next page">›</button>
  </div>
  <div id="navigation">
    <button id="closer" class="reader-control" type="button" aria-label="Close table of contents">×</button>
    <h1 id="title">...</h1>
    <img id="cover" width="150" alt="">
    <h2 id="author">...</h2>
    <ul id="toc"></ul>
  </div>

</body>
</html>
