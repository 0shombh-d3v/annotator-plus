name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install vendored Hypothesis dependencies
        working-directory: vendor/hypothesis-client
        run: node .yarn/releases/yarn-3.6.0.cjs install --immutable
      - name: Install Chromium for Hypothesis tests
        run: node vendor/hypothesis-client/node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run check
      - run: npm run check:vendor
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run release:verify
