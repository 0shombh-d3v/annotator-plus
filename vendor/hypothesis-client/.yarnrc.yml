nodeLinker: node-modules

plugins:
  - path: .yarn/plugins/@yarnpkg/plugin-version.cjs
    spec: "@yarnpkg/plugin-version"

yarnPath: .yarn/releases/yarn-3.6.0.cjs

# The patched annotation-ui renderer uses Marked instead of Showdown.
# Patches cannot alter dependency resolution, so declare its replacement here.
packageExtensions:
  "@hypothesis/annotation-ui@1.1.0":
    dependencies:
      marked: "18.1.1"
    peerDependenciesMeta:
      showdown:
        optional: true
